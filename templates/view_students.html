<!DOCTYPE html>
<html>
<head>
    <title>View Students</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f6ff;
            text-align: center;
            padding: 40px;
        }

        h1 {
            color: #1f3c88;
            font-size: 38px;
        }

        form {
            margin-bottom: 25px;
        }

        input {
            padding: 12px;
            width: 280px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
        }

        button {
            background-color: #1f3c88;
            color: white;
            border: none;
            padding: 11px 20px;
            margin: 5px;
            border-radius: 6px;
            font-size: 15px;
            cursor: pointer;
        }

        button:hover {
            background-color: #162d66;
        }

        table {
            width: 95%;
            margin: auto;
            background-color: white;
            border-collapse: collapse;
            box-shadow: 0 0 15px #ccc;
        }

        th {
            background-color: #1f3c88;
            color: white;
            padding: 14px;
        }

        td {
            padding: 12px;
            border: 1px solid #ddd;
        }

        tr:hover {
            background-color: #f1f5ff;
        }

        .delete {
            background-color: #d32f2f;
        }

        .delete:hover {
            background-color: #a51f1f;
        }
    </style>
</head>

<body>

    <h1>Student List</h1>

    <form method="GET" action="/search">
        <input type="text" name="name" placeholder="Search Student Name" required>
        <button type="submit">Search</button>
    </form>

    <table>

        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Email</th>
            <th>Phone</th>
            <th>Course</th>
            <th>Department</th>
            <th>Action</th>
        </tr>

        {% for student in students %}

        <tr>
            <td>{{ student[0] }}</td>
            <td>{{ student[1] }}</td>
            <td>{{ student[2] }}</td>
            <td>{{ student[3] }}</td>
            <td>{{ student[4] }}</td>
            <td>{{ student[5] }}</td>

            <td>
                <a href="/edit/{{ student[0] }}">
                    <button type="button">Edit</button>
                </a>

                <a href="/delete/{{ student[0] }}">
                    <button type="button" class="delete">Delete</button>
                </a>
            </td>
        </tr>

        {% endfor %}

    </table>

    <br>

    <a href="/">
        <button type="button">Back to Home</button>
    </a>

</body>
</html>
