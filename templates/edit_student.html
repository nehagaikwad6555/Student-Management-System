<!DOCTYPE html>
<html>
<head>
    <title>Edit Student</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f6ff;
            text-align: center;
            padding-top: 50px;
        }

        h1 {
            color: #1f3c88;
            font-size: 38px;
        }

        form {
            background-color: white;
            width: 400px;
            margin: auto;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 0 15px #ccc;
        }

        input {
            width: 90%;
            padding: 12px;
            margin: 8px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
        }

        button {
            background-color: #1f3c88;
            color: white;
            border: none;
            padding: 12px 25px;
            margin: 8px;
            border-radius: 7px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #162d66;
        }
    </style>
</head>

<body>

    <h1>Edit Student</h1>

    <form method="POST">

        <input type="text" name="name"
               value="{{ student[1] }}" required>

        <input type="email" name="email"
               value="{{ student[2] }}">

        <input type="text" name="phone"
               value="{{ student[3] }}">

        <input type="text" name="course"
               value="{{ student[4] }}">

        <input type="text" name="department"
               value="{{ student[5] }}">

        <button type="submit">Update Student</button>

    </form>

    <br>

    <a href="/view">
        <button>Back to Students</button>
    </a>

</body>
</html>
