<!DOCTYPE html>
<html>
<head>
    <title>Edit Student</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f6ff;
            text-align: center;
            padding-top: 50px;
        }

        h1 {
            color: #1f3c88;
            font-size: 38px;
        }

        form {
            background-color: white;
            width: 400px;
            max-width: 85%;
            margin: auto;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 0 15px #ccc;
        }

        input {
            width: 90%;
            box-sizing: border-box;
            padding: 12px;
            margin: 8px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
        }

        button {
            background-color: #1f3c88;
            color: white;
            border: none;
            padding: 12px 25px;
            margin: 8px;
            border-radius: 7px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #162d66;
        }
    </style>
</head>

<body>

    <h1>Edit Student</h1>

    <form method="POST">
        <input
            type="text"
            name="name"
            placeholder="Student Name"
            value="{{ student.name }}"
            required
        >

        <input
            type="email"
            name="email"
            placeholder="Email"
            value="{{ student.email or '' }}"
        >

        <input
            type="text"
            name="phone"
            placeholder="Phone"
            value="{{ student.phone or '' }}"
        >

        <input
            type="text"
            name="course"
            placeholder="Course"
            value="{{ student.course or '' }}"
        >

        <input
            type="text"
            name="department"
            placeholder="Department"
            value="{{ student.department or '' }}"
        >

        <button type="submit">Update Student</button>
    </form>

    <br>

    <a href="/view">
        <button type="button">Back to Students</button>
    </a>

</body>
</html>
